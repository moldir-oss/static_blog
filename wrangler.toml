
name = "mon-licenciement-blog"
compatibility_date = "2024-01-01"
pages_build_output_dir = "./public"

# Canonical D1 (single backend, shared with workers/wrangler.visits.toml).
# Create: npx wrangler d1 create visits -> paste database_id -> migrate workers/schema.sql
[[d1_databases]]
binding = "VISITS_DB"
database_name = "visits"
database_id = "REPLACE_ME"

[vars]
ANONYMIZE_IP = "0"
ALLOWED_ORIGINS = "*"

[build]
  command = "node scripts/build.mjs --target cloudflare"
  destination = "public"
  [build.environment]
    HUGO_VERSION = "0.165.0"
    HUGO_ENV = "production"
    HUGO_ENVIRONMENT = "production"
    GOFLAGS = "-mod=mod"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/*/"
  to = "/:splat"
  status = 301



[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"


