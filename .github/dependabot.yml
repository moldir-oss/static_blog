version: 2

updates:
  # npm updates (package.json / package-lock.json)
  # Auto-updates: fuse.js, @vercel/kv, @netlify/blobs, archiver...
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "npm"
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"

  # Go modules tracking (via go.mod)
  # Auto-updates:
  #   - go 1.22 → 1.23 → 1.24... (Go version)
  #   - github.com/adityatelange/hugo-PaperMod (theme)
  #   - All indirect dependencies (gohugoio/hugo, goldmark, etc.)
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "hugo-theme"
    # Auto-merge when checks pass
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"

  # GitHub Actions tracking
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"

  # Hugo Docker image tracking (Dockerfile.hugo)
  # Dependabot detects new tags on Docker Hub → PR
  # The auto-merge workflow propagates the version into hugo.yml, netlify.toml, wrangler.toml...
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "hugo"
    allow:
      - dependency-type: "direct"
