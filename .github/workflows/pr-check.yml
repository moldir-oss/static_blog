name: PR Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: "0.165.0"
    steps:
      - name: Hardware specifications summary
        run: |
          CPU_EXACT=$(grep -m 1 'model name' /proc/cpuinfo | cut -d':' -f2 | xargs)
          RAM_TOTAL=$(free -h | awk '/^Mem:/ {print $2}')
          DISK_INFO=$(df -h / | awk 'NR==2 {print $2 " total (" $4 " available)"}')
      
          echo "### 💻 Runner Specs" >> $GITHUB_STEP_SUMMARY
          echo "* **Exact CPU Model:** $CPU_EXACT" >> $GITHUB_STEP_SUMMARY
          echo "* **CPU Cores:** $(nproc)" >> $GITHUB_STEP_SUMMARY
          echo "* **RAM:** $RAM_TOTAL" >> $GITHUB_STEP_SUMMARY
          echo "* **Disk (SSD):** $DISK_INFO" >> $GITHUB_STEP_SUMMARY
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Get Hugo modules
        run: hugo mod get -u

      - name: Install Node.js dependencies
        if: hashFiles('package-lock.json') != '' || hashFiles('npm-shrinkwrap.json') != ''
        run: npm ci

      - name: Validate hugo.toml
        run: |
          hugo config --environment production > /dev/null
          echo "✅ hugo.toml valid"

      - name: Build check
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo --gc --minify
          echo "✅ Hugo build succeeded"

      - name: Check front matter
        run: |
          errors=0
          for file in $(find content -name "*.md"); do
            if ! head -1 "$file" | grep -q "^---"; then
              echo "❌ Missing front matter: $file"
              errors=$((errors + 1))
            fi
          done
          if [ $errors -gt 0 ]; then
            exit 1
          fi
          echo "✅ Front matter validated on all posts"

      - name: Check for broken links (optional)
        if: false
        run: |
          npm install -g @markdown-link-check/markdown-link-check
          find content -name "*.md" -exec markdown-link-check {} \;
