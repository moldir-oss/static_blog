baseURL = "https://moldir-oss.github.io/static_blog/"
defaultContentLanguage = "fr"
title = "Dossier Licenciement"

[module]
  [[module.imports]]
    path = "github.com/adityatelange/hugo-PaperMod"

copyright = "© 2026 - Tous droits réservés"

[pagination]
  pagerSize = 5
  disableAliases = false

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false
enableEmoji = true
pygmentsUseClasses = true

[languages]
  [languages.fr]
    locale = "fr-fr"
    label = "Français"
    weight = 1
    [languages.fr.params]
      languageAltTitle = "Français"
      flag = "🇫🇷"
    [[languages.fr.menu.main]]
      identifier = "fr-accueil"
      name = "Accueil"
      url = "/"
      weight = 10
    [[languages.fr.menu.main]]
      identifier = "fr-articles"
      name = "Articles"
      url = "/posts"
      weight = 20
    [[languages.fr.menu.main]]
      identifier = "fr-chronologie"
      name = "Chronologie"
      url = "/chronologie"
      weight = 25
    [[languages.fr.menu.main]]
      identifier = "fr-archives"
      name = "Archives"
      url = "/archives"
      weight = 30
    [[languages.fr.menu.main]]
      identifier = "fr-recherche"
      name = "Recherche"
      url = "/search"
      weight = 40
    [[languages.fr.menu.main]]
      identifier = "fr-tags"
      name = "Tags"
      url = "/tags"
      weight = 50
    [[languages.fr.menu.main]]
      identifier = "fr-contact"
      name = "Contact"
      url = "/contact"
      weight = 60
  [languages.en]
    locale = "en-us"
    contentDir = "content.en"
    label = "English"
    weight = 2
    title = "Dismissal Case File"
    [[languages.en.menu.main]]
      identifier = "en-home"
      name = "Home"
      url = "/"
      weight = 10
    [[languages.en.menu.main]]
      identifier = "en-posts"
      name = "Posts"
      url = "/posts"
      weight = 20
    [[languages.en.menu.main]]
      identifier = "en-timeline"
      name = "Timeline"
      url = "/chronologie"
      weight = 25
    [[languages.en.menu.main]]
      identifier = "en-archives"
      name = "Archives"
      url = "/archives"
      weight = 30
    [[languages.en.menu.main]]
      identifier = "en-search"
      name = "Search"
      url = "/search"
      weight = 40
    [[languages.en.menu.main]]
      identifier = "en-tags"
      name = "Tags"
      url = "/tags"
      weight = 50
    [[languages.en.menu.main]]
      identifier = "en-contact"
      name = "Contact"
      url = "/contact"
      weight = 60

  [languages.en.params]
    languageAltTitle = "English"
    flag = "🇬🇧"
    description = "A full account of a dismissal case, from the warning to the court decision."
    [languages.en.params.label]
      text = "Dismissal Case File"
    [languages.en.params.profileMode]
      enabled = true
      title = "The Dismissal Case File"
      subtitle = "All the documents, steps and the complete timeline — from the warning to the court decision."
      imageUrl = "images/cover.svg"
      imageWidth = 140
      imageHeight = 140
      imageTitle = "Dismissal Case File"
      [[languages.en.params.profileMode.buttons]]
        name = "Read the articles"
        url = "/posts"
      [[languages.en.params.profileMode.buttons]]
        name = "View the timeline"
      url = "/chronologie"

[params]
  env = "production"
  description = "Retour complet sur un cas de licenciement effectué par Nexteer Automotive, de l'avertissement à la décision de justice."
  author = "Rédaction"

  ShowLanguageSelector = true
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = false
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = true
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = true

  cusdisHost = "https://cusdis.com"
  cusdisAppId = ""

  [params.assets]
    favicon = "/favicon.ico"
    favicon16x16 = "/favicon-16x16.png"
    favicon32x32 = "/favicon-32x32.png"
    apple_touch_icon = "/apple-touch-icon.png"
    safari_pinned_tab = "/safari-pinned-tab.svg"

  [params.label]
    text = "Dossier Licenciement"
    icon = "images/cover.svg"
    iconHeight = 35

  [params.profileMode]
    enabled = true
    title = "Le dossier de licenciement"
    subtitle = "Tous les documents, étapes et la chronologie complète — de l'avertissement à la décision de justice."
    imageUrl = "images/cover.svg"
    imageWidth = 140
    imageHeight = 140
    imageTitle = "Dossier Licenciement"
    [[params.profileMode.buttons]]
      name = "Lire les articles"
      url = "/posts"
    [[params.profileMode.buttons]]
      name = "Voir la chronologie"
      url = "/chronologie"

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]


  goatcounterCode = ""

  [params.visits]
    # Single canonical backend (Worker+D1). Empty = same-origin /api/visit fallback.
    # CI override: HUGO_VISIT_API_URL="https://mon-licenciement-visits.<account>.workers.dev/api/visit"
    apiUrl = ""

  [params.employer]
    name = "Nexteer Automotive"
    logo = "images/nexteer-logo.png"
    website = "https://www.nexteer.com"

  [params.giscus]
    repo = ""
    repoId = ""
    category = ""
    categoryId = ""
    mapping = "pathname"
    strict = "0"
    reactionsEnabled = "1"
    inputPosition = "bottom"
    theme = "preferred_color_scheme"

[security]
  [security.funcs]
    getenv = ['^HUGO_', '^CI$', '^GISCUS_', '^CUSDIS_']

[outputs]
  home = ["HTML", "RSS", "JSON", "ROBOTS"]

[taxonomies]
  category = "categories"
  tag = "tags"
  series = "series"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      typographer = true
  [markup.highlight]
    noClasses = false
    anchorLineNos = true
    codeFences = true
    guessSyntax = true
    lineNos = true
    style = "monokai"


